onboarding = false

[theme]
name = "catppuccin"

[keys]
prefix = "ctrl+a"

detach = "prefix+d"
previous_workspace = "prefix+k"
next_workspace = "prefix+j"

[experimental]
pane_history = true

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = true

[ui]
show_agent_labels_on_pane_borders = true

sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"

tab_bar_right_separator = " > "
tab_bar_right = [
  { type = "text", text = " Mac de Matthieu" },
  { type = "datetime", format = " %H:%M" },
  { type = "command", command = "~/.config/herdr/workspace.sh", interval_seconds = 5, timeout_seconds = 2 },
]

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "todo"
description = "todo list"
width = "80%"
height = "75%"
